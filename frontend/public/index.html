<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Assist Dashboard</title>
    <link rel="icon" href="BlogAssist.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .log-container { scroll-behavior: smooth; }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto flex gap-6">
        
        <!-- Sidebar Settings -->
        <div class="w-1/3 glass-panel rounded-2xl p-6 shadow-xl h-fit">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Settings
            </h2>
            <form id="configForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">AI Provider</label>
                    <select id="llm_provider" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="Google Gemini">Google Gemini</option>
                        <option value="OpenAI">OpenAI</option>
                        <option value="Simulated">Simulated (Testing)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">API Key</label>
                    <input type="password" id="api_key" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <hr class="border-slate-700">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">WordPress URL</label>
                    <input type="text" id="wp_url" placeholder="https://yoursite.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">WP Username</label>
                    <input type="text" id="wp_user" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">WP App Password</label>
                    <input type="password" id="wp_password" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition-colors shadow-lg shadow-blue-500/30">Save Configuration</button>
            </form>
        </div>

        <!-- Main Interface -->
        <div class="w-2/3 flex flex-col gap-6">
            <!-- Header -->
            <div class="glass-panel rounded-2xl p-6 shadow-xl flex items-center gap-4">
                <img src="BlogAssist.png" onerror="this.style.display='none'" alt="Logo" class="w-12 h-12 rounded-xl">
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Blog Assist</h1>
                    <p class="text-slate-400">Automate your blog with AI-generated content directly to WordPress.</p>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="flex gap-6">
                <!-- Agent Config -->
                <div class="w-1/2 glass-panel rounded-2xl p-6 shadow-xl">
                    <h3 class="text-lg font-semibold mb-4 text-emerald-400">Agent Configuration</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Topic</label>
                            <input type="text" id="topic" value="Tech" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="flex gap-4">
                            <div class="w-1/2">
                                <label class="block text-sm text-slate-400 mb-1">Word Count</label>
                                <input type="number" id="word_count" value="500" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div class="w-1/2">
                                <label class="block text-sm text-slate-400 mb-1">Schedule (Hrs)</label>
                                <input type="number" id="schedule_interval" value="24" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Post Status</label>
                            <select id="post_status" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="draft">Draft</option>
                                <option value="publish">Publish</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Agent Status -->
                <div class="w-1/2 glass-panel rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                    <div>
                        <h3 class="text-lg font-semibold mb-4 text-emerald-400">Agent Status</h3>
                        <div class="flex gap-4 mb-4">
                            <button id="btnStart" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg transition-colors font-medium shadow-lg shadow-emerald-500/30">▶ Start Agent</button>
                            <button id="btnStop" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2 rounded-lg transition-colors font-medium shadow-lg shadow-rose-500/30">⏹ Stop Agent</button>
                        </div>
                        <div class="bg-slate-800 rounded-lg p-4 mb-4 border border-slate-700">
                            <div class="flex justify-between mb-2">
                                <span class="text-slate-400 text-sm">Status:</span>
                                <span id="statusIndicator" class="text-rose-400 font-medium text-sm">Stopped</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400 text-sm">Next Run:</span>
                                <span id="nextRun" class="text-slate-200 text-sm">N/A</span>
                            </div>
                        </div>
                    </div>
                    <button id="btnManual" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg transition-colors font-medium">Run Once Now</button>
                </div>
            </div>

            <!-- Activity Log -->
            <div class="glass-panel rounded-2xl p-6 shadow-xl flex-grow flex flex-col">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Activity Log
                </h3>
                <div id="logContainer" class="log-container flex-grow bg-slate-900 border border-slate-800 rounded-lg p-4 overflow-y-auto font-mono text-sm text-green-400 h-64 space-y-1">
                    <!-- Logs injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Load Config on Startup
        async function loadConfig() {
            try {
                const res = await fetch(`${API_URL}/config`);
                const data = await res.json();
                
                document.getElementById('llm_provider').value = data.llm_provider || 'Google Gemini';
                document.getElementById('api_key').value = data.api_key || '';
                document.getElementById('wp_url').value = data.wp_url || '';
                document.getElementById('wp_user').value = data.wp_user || '';
                document.getElementById('wp_password').value = data.wp_password || '';
                
                document.getElementById('topic').value = data.topic || 'Tech';
                document.getElementById('word_count').value = data.word_count || 500;
                document.getElementById('schedule_interval').value = data.schedule_interval || 24;
                document.getElementById('post_status').value = data.post_status || 'draft';
            } catch (err) {
                console.error("Error loading config", err);
            }
        }

        // Save Config
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const config = {
                llm_provider: document.getElementById('llm_provider').value,
                api_key: document.getElementById('api_key').value,
                wp_url: document.getElementById('wp_url').value,
                wp_user: document.getElementById('wp_user').value,
                wp_password: document.getElementById('wp_password').value,
                topic: document.getElementById('topic').value,
                word_count: parseInt(document.getElementById('word_count').value),
                schedule_interval: parseInt(document.getElementById('schedule_interval').value),
                post_status: document.getElementById('post_status').value,
            };
            
            try {
                const res = await fetch(`${API_URL}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if(res.ok) {
                    alert("Configuration saved!");
                }
            } catch(err) {
                alert("Error saving config");
            }
        });

        // Controls
        document.getElementById('btnStart').addEventListener('click', async () => {
            // Must save the config values from the right side first before starting
            document.getElementById('configForm').dispatchEvent(new Event('submit'));
            
            const res = await fetch(`${API_URL}/start`, { method: 'POST' });
            const data = await res.json();
            if(res.ok) fetchStatus();
            else alert(data.detail);
        });

        document.getElementById('btnStop').addEventListener('click', async () => {
            await fetch(`${API_URL}/stop`, { method: 'POST' });
            fetchStatus();
        });

        document.getElementById('btnManual').addEventListener('click', async () => {
             // Must save the config values from the right side first before starting
             document.getElementById('configForm').dispatchEvent(new Event('submit'));
             
            const btn = document.getElementById('btnManual');
            btn.innerText = "Running...";
            btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/run-manual`, { method: 'POST' });
                const data = await res.json();
                if(!res.ok) alert(data.detail);
            } finally {
                btn.innerText = "Run Once Now";
                btn.disabled = false;
            }
        });

        // Polling
        async function fetchStatus() {
            try {
                const res = await fetch(`${API_URL}/status`);
                const data = await res.json();
                
                const statusIndicator = document.getElementById('statusIndicator');
                if (data.is_running) {
                    statusIndicator.innerText = "Running";
                    statusIndicator.className = "text-emerald-400 font-medium text-sm";
                } else {
                    statusIndicator.innerText = "Stopped";
                    statusIndicator.className = "text-rose-400 font-medium text-sm";
                }
                
                document.getElementById('nextRun').innerText = data.next_run;
            } catch(err) {}
        }

        async function fetchLogs() {
            try {
                const res = await fetch(`${API_URL}/logs`);
                const logs = await res.json();
                const container = document.getElementById('logContainer');
                
                // Only update if logs changed to avoid scroll jumping
                const currentContent = container.innerText;
                const newContent = logs.join('\n');
                
                if (currentContent !== newContent) {
                    container.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
                    container.scrollTop = container.scrollHeight;
                }
            } catch(err) {}
        }

        // Init
        loadConfig();
        fetchStatus();
        fetchLogs();
        
        setInterval(fetchStatus, 3000);
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>

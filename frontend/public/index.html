<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Assist</title>
    <link rel="icon" href="BlogAssist.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Analytics placeholder -->
    <script id="ga-script"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111827; }
        .glass-card { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f3f4f6;}
        .log-container { scroll-behavior: smooth; }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        
        /* Hide screens by default */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-item.active { color: #f97316; font-weight: 600; }
        .nav-item.active svg { stroke: #f97316; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">
    
    <!-- Sidebar / Bottom Nav -->
    <nav class="fixed bottom-0 w-full md:relative md:w-64 bg-white border-t md:border-t-0 md:border-r border-gray-200 z-50 flex md:flex-col justify-around md:justify-start p-4 md:p-6 md:h-screen">
        <div class="hidden md:flex items-center gap-3 mb-10">
            <img src="BlogAssist.png" onerror="this.style.display='none'" alt="Logo" class="w-10 h-10 rounded-xl shadow-sm">
            <h1 class="text-xl font-bold tracking-tight">Blog Assist</h1>
        </div>
        
        <button onclick="switchScreen('home')" id="nav-home" class="nav-item active flex md:w-full flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:py-3 md:px-4 rounded-xl hover:bg-gray-50 text-gray-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-xs md:text-base">Home</span>
        </button>
        
        <button onclick="switchScreen('logs')" id="nav-logs" class="nav-item flex md:w-full flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:py-3 md:px-4 rounded-xl hover:bg-gray-50 text-gray-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span class="text-xs md:text-base">Activity</span>
        </button>

        <button onclick="switchScreen('settings')" id="nav-settings" class="nav-item flex md:w-full flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:py-3 md:px-4 rounded-xl hover:bg-gray-50 text-gray-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-xs md:text-base">Settings</span>
        </button>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full max-w-5xl mx-auto">
        
        <!-- ================= HOME SCREEN ================= -->
        <div id="screen-home" class="screen active space-y-6">
            <header class="mb-8">
                <p class="text-gray-500 font-medium">Total Posts Published</p>
                <h2 id="totalPosts" class="text-4xl font-extrabold tracking-tight">0</h2>
            </header>

            <!-- Chart Card -->
            <div class="glass-card p-6">
                <div class="flex justify-between items-end mb-4">
                    <h3 class="font-bold text-gray-800">Weekly Activity</h3>
                    <span id="nextRunBadge" class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full font-semibold">Next Run: N/A</span>
                </div>
                <div class="h-48 w-full">
                    <canvas id="postsChart"></canvas>
                </div>
            </div>

            <!-- Agent Controls -->
            <div>
                <h3 class="font-bold text-gray-800 mb-3 ml-1">Agent Controls</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <button id="btnStart" class="bg-orange-500 hover:bg-orange-600 text-white p-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all shadow-md shadow-orange-500/20 active:scale-95">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="font-semibold text-sm">Start Auto</span>
                    </button>
                    <button id="btnStop" class="bg-gray-800 hover:bg-gray-900 text-white p-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all shadow-md active:scale-95">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                        <span class="font-semibold text-sm">Stop Auto</span>
                    </button>
                    <button id="btnManual" class="col-span-2 md:col-span-1 bg-blue-500 hover:bg-blue-600 text-white p-4 rounded-3xl flex flex-col items-center justify-center gap-2 transition-all shadow-md shadow-blue-500/20 active:scale-95">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span class="font-semibold text-sm">Run Once Now</span>
                    </button>
                </div>
            </div>
            
            <!-- Quick Status -->
            <div class="glass-card p-4 flex items-center justify-between">
                <span class="text-sm font-medium text-gray-500">Engine Status</span>
                <div class="flex items-center gap-2">
                    <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <span id="statusIndicator" class="font-bold text-gray-800 text-sm">Stopped</span>
                </div>
            </div>
        </div>

        <!-- ================= LOGS SCREEN ================= -->
        <div id="screen-logs" class="screen h-full">
            <div class="h-full flex flex-col">
                <header class="mb-6">
                    <h2 class="text-3xl font-extrabold tracking-tight">Activity Logs</h2>
                    <p class="text-gray-500 text-sm">Real-time execution history</p>
                </header>
                <div class="glass-card p-4 flex-1 h-[70vh]">
                    <div id="logContainer" class="log-container h-full overflow-y-auto font-mono text-xs md:text-sm text-gray-700 space-y-2 p-2">
                        <!-- Logs injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= SETTINGS SCREEN ================= -->
        <div id="screen-settings" class="screen pb-10">
            <header class="mb-6">
                <h2 class="text-3xl font-extrabold tracking-tight">Settings</h2>
            </header>
            
            <form id="configForm" class="space-y-6">
                
                <!-- Content Config -->
                <div class="glass-card p-6">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">Content Strategy</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Topic / Niche</label>
                            <input type="text" id="topic" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Post Status</label>
                            <select id="post_status" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                                <option value="draft">Save as Draft</option>
                                <option value="publish">Publish Immediately</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Word Count</label>
                            <input type="number" id="word_count" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Schedule (Hrs)</label>
                            <input type="number" id="schedule_interval" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Integrations -->
                <div class="glass-card p-6">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">Integrations</h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">AI Provider</label>
                                <select id="llm_provider" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                                    <option value="Google Gemini">Google Gemini</option>
                                    <option value="OpenAI">OpenAI</option>
                                    <option value="Simulated">Simulated (Testing)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">API Key</label>
                                <input type="password" id="api_key" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">WordPress URL</label>
                                <input type="text" id="wp_url" placeholder="https://yoursite.com" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">WP Username</label>
                                <input type="text" id="wp_user" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">WP App Password</label>
                                <input type="password" id="wp_password" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Analytics -->
                <div class="glass-card p-6">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">Analytics</h3>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Google Analytics ID</label>
                        <input type="text" id="google_analytics_id" placeholder="G-XXXXXXXXXX" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-xl p-3 focus:ring-2 focus:ring-orange-500 outline-none">
                        <p class="text-xs text-gray-400 mt-2">Leave blank to disable tracking.</p>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-gray-900/20 active:scale-95">
                    Save Configuration
                </button>
            </form>
        </div>

    </main>

    <script>
        const API_URL = '/api';
        let chartInstance = null;

        // --- Navigation ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('screen-' + screenId).classList.add('active');
            document.getElementById('nav-' + screenId).classList.add('active');
            
            if(screenId === 'logs') fetchLogs();
            if(screenId === 'home') fetchAnalytics();
        }

        // --- Chart.js Setup ---
        function initChart(labels, data) {
            const ctx = document.getElementById('postsChart').getContext('2d');
            
            // Gradient fill
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(249, 115, 22, 0.2)'); // Orange
            gradient.addColorStop(1, 'rgba(249, 115, 22, 0)');
            
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Posts',
                        data: data,
                        borderColor: '#f97316',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#f97316',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { display: false, drawBorder: false }, ticks: { display: false } },
                        x: { grid: { display: false, drawBorder: false }, ticks: { color: '#9ca3af', font: { family: 'Inter', size: 10 } } }
                    },
                    interaction: { intersect: false, mode: 'index', }
                }
            });
        }

        // --- API Calls ---
        async function fetchAnalytics() {
            try {
                const res = await fetch(`${API_URL}/analytics`);
                const data = await res.json();
                document.getElementById('totalPosts').innerText = data.total_posts.toLocaleString();
                initChart(data.labels, data.data);
            } catch(e) {}
        }

        async function loadConfig() {
            try {
                const res = await fetch(`${API_URL}/config`);
                const data = await res.json();
                
                document.getElementById('llm_provider').value = data.llm_provider || 'Google Gemini';
                document.getElementById('api_key').value = data.api_key || '';
                document.getElementById('wp_url').value = data.wp_url || '';
                document.getElementById('wp_user').value = data.wp_user || '';
                document.getElementById('wp_password').value = data.wp_password || '';
                
                document.getElementById('topic').value = data.topic || 'Tech';
                document.getElementById('word_count').value = data.word_count || 500;
                document.getElementById('schedule_interval').value = data.schedule_interval || 24;
                document.getElementById('post_status').value = data.post_status || 'draft';
                document.getElementById('google_analytics_id').value = data.google_analytics_id || '';

                // Inject GA if present
                if (data.google_analytics_id) {
                    injectGA(data.google_analytics_id);
                }
            } catch (err) {}
        }

        function injectGA(id) {
            const script = document.createElement('script');
            script.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
            script.async = true;
            document.head.appendChild(script);
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', id);
        }

        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const config = {
                llm_provider: document.getElementById('llm_provider').value,
                api_key: document.getElementById('api_key').value,
                wp_url: document.getElementById('wp_url').value,
                wp_user: document.getElementById('wp_user').value,
                wp_password: document.getElementById('wp_password').value,
                topic: document.getElementById('topic').value,
                word_count: parseInt(document.getElementById('word_count').value),
                schedule_interval: parseInt(document.getElementById('schedule_interval').value),
                post_status: document.getElementById('post_status').value,
                google_analytics_id: document.getElementById('google_analytics_id').value,
            };
            
            try {
                const res = await fetch(`${API_URL}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if(res.ok) alert("Settings saved!");
            } catch(err) {
                alert("Error saving config");
            }
        });

        // Controls
        document.getElementById('btnStart').addEventListener('click', async () => {
            const res = await fetch(`${API_URL}/start`, { method: 'POST' });
            if(res.ok) fetchStatus();
            else { const d = await res.json(); alert(d.detail); }
        });

        document.getElementById('btnStop').addEventListener('click', async () => {
            await fetch(`${API_URL}/stop`, { method: 'POST' });
            fetchStatus();
        });

        document.getElementById('btnManual').addEventListener('click', async () => {
            const btn = document.getElementById('btnManual');
            btn.querySelector('span').innerText = "Running...";
            try {
                const res = await fetch(`${API_URL}/run-manual`, { method: 'POST' });
                if(!res.ok) { const d = await res.json(); alert(d.detail); }
                fetchAnalytics();
            } finally {
                btn.querySelector('span').innerText = "Run Once Now";
            }
        });

        // Polling
        async function fetchStatus() {
            try {
                const res = await fetch(`${API_URL}/status`);
                const data = await res.json();
                
                const indicator = document.getElementById('statusIndicator');
                const dot = document.getElementById('statusDot');
                
                if (data.is_running) {
                    indicator.innerText = "Active";
                    dot.className = "w-2.5 h-2.5 rounded-full bg-orange-500";
                } else {
                    indicator.innerText = "Stopped";
                    dot.className = "w-2.5 h-2.5 rounded-full bg-gray-300";
                }
                
                document.getElementById('nextRunBadge').innerText = data.is_running ? `Next: ${data.next_run}` : 'Inactive';
            } catch(err) {}
        }

        async function fetchLogs() {
            if(!document.getElementById('screen-logs').classList.contains('active')) return;
            try {
                const res = await fetch(`${API_URL}/logs`);
                const logs = await res.json();
                const container = document.getElementById('logContainer');
                const currentContent = container.innerText;
                const newContent = logs.join('\n');
                
                if (currentContent !== newContent) {
                    container.innerHTML = logs.map(l => `<div class="border-b border-gray-100 pb-1 mb-1">${l}</div>`).join('');
                }
            } catch(err) {}
        }

        // Init
        loadConfig();
        fetchStatus();
        fetchAnalytics();
        
        setInterval(fetchStatus, 3000);
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
